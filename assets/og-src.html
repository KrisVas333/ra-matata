<!doctype html>
<html lang="lt"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#FFF8EC;font-family:Nunito,sans-serif;color:#152039}
.g{position:absolute;inset:0;background:linear-gradient(#FBE9C4 1.5px,transparent 1.5px) 0 0/120px 120px,linear-gradient(90deg,#FBE9C4 1.5px,transparent 1.5px) 0 0/120px 120px}
.copy{position:absolute;left:72px;top:56px;width:560px}
.tag{display:inline-block;background:#FEC404;border-radius:999px;padding:8px 18px;font-weight:800;font-size:20px;margin-bottom:18px}
h1{font-family:Syne,sans-serif;font-weight:800;font-size:54px;line-height:1.04;letter-spacing:-.02em;margin:0 0 22px}
h1 em{font-style:normal;color:#2A4FB5}
p{font-size:23px;font-weight:700;color:#3E4A6B;margin:0 0 22px;line-height:1.35}
.ra{font-weight:800;font-size:22px;display:flex;align-items:center;gap:14px}
.ra img{height:34px}
.ph{position:absolute;right:60px;top:70px;width:480px;height:490px;border-radius:30px;background:#fff;padding:10px;box-shadow:0 30px 60px -30px rgba(21,32,57,.4);transform:rotate(2deg)}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:22px}
.cmd{position:absolute;right:300px;bottom:60px;display:flex;gap:10px}
.cmd i{width:62px;height:62px;border-radius:16px;border:4px solid #fff;display:block;box-shadow:0 10px 20px -10px rgba(21,32,57,.5)}
</style></head>
<body>
<div class="g"></div>
<div class="copy">
  <span class="tag">3 ir 4 metų vaikams</span>
  <h1>Pirmoji robotika <em>be ekrano</em>, su knyga rankose.</h1>
  <p>Robotas eina per pasakos žemėlapį, vaikas spaudžia mygtukus. Žodžiai lietuviškai ir angliškai, skaičiai, knygos.</p>
  <div class="ra"><img src="ra-logo.svg" alt="">Matata · nauja programa</div>
</div>
<div class="ph"><img src="img/hero-zoo-1400.webp" alt=""></div>
<div class="cmd"><i style="background:#56B13F"></i><i style="background:#56B13F"></i><i style="background:#FEC404"></i><i style="background:#3F6EDC"></i></div>
</body></html>
