<!doctype html>
<html lang="lt"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:linear-gradient(165deg,#3357C9 0%,#3F6EDC 55%,#3B86E8 100%);font-family:Nunito,sans-serif;color:#fff}
.copy{position:absolute;left:64px;top:60px;width:560px}
.logo{height:52px;width:auto;display:block;margin-bottom:34px}
.tag{display:inline-block;background:#FEC404;color:#152039;border-radius:999px;padding:8px 18px;font-weight:800;font-size:20px;margin-bottom:18px}
h1{font-family:Syne,sans-serif;font-weight:800;font-size:58px;line-height:1.04;margin:0 0 20px}
h1 em{font-style:normal;color:#FEC404}
p{font-size:23px;font-weight:700;color:#E6ECFF;margin:0 0 20px;line-height:1.35}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.facts span{background:#fff;color:#152039;border-radius:999px;padding:8px 16px;font-weight:800;font-size:18px}
.ph{position:absolute;right:56px;top:72px;width:480px;height:420px;border-radius:28px;background:#fff;padding:10px;box-shadow:0 30px 60px -30px rgba(21,32,57,.5);transform:rotate(2deg)}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:20px}
.ph .cap{position:absolute;left:24px;bottom:24px;background:rgba(21,32,57,.8);color:#fff;font-size:14px;font-weight:800;padding:5px 11px;border-radius:999px}
.bubble{position:absolute;right:40px;top:40px;background:#FEC404;color:#152039;font-family:Syne,sans-serif;font-weight:800;font-size:22px;padding:14px 20px;border-radius:22px 22px 22px 4px;box-shadow:0 14px 30px -14px rgba(21,32,57,.5)}
</style></head>
<body>
<div class="copy">
  <img class="logo" src="../assets/logo/ra-logo-white.svg" alt="">
  <span class="tag">3–4 metų vaikams</span>
  <h1>Robotas ir pasakų knyga. <em>Be ekrano.</em></h1>
  <p>Pirmasis Robotikos akademijos būrelis 3–4 metų vaikams su kalbančiu robotu. 30 min kartą per savaitę.</p>
  <div class="facts"><span>darželyje nuo 25 €/mėn.</span><span>iki 10 vaikų</span><span>Vilnius</span></div>
</div>
<div class="ph"><img src="../assets/img/ai-liutas-du-vaikai-3x2-1200.webp" alt=""><span class="cap">DI iliustracija</span></div>
<div class="bubble">Labas! Hello!</div>
</body></html>
